name: ClearFund quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.0'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint (read-only)
        run: |
          bunx oxlint --type-aware src scripts
          bunx oxlint .
      - name: Unit tests
        run: bunx vitest run
      - name: Production build with explicit Arc Mainnet
        env:
          VITE_CLEARFUND_CHAIN: mainnet
          VITE_CLEARFUND_ESCROW_ADDRESS: ''
        run: bun run build
